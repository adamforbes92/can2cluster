; Can2Cluster - one codebase, two PCBs. Pick the board with -e (or the env
; picker in the PlatformIO toolbar):
;
;   pio run -e esp32doit-devkit-v1     ESP32 DevKit V1 boards (plain GPIO). Coolant
;                                      gauge borrows the EML or EPC output as PWM.
;   pio run -e esp32-s3                ESP32-S3-WROOM-1-N16R8 board
;                                      (PCB/ProPrj_can2clusterV4-s3-reva): native USB,
;                                      dedicated COOLANT_OUT current sink (MCP4725),
;                                      switched output / speed-input pull-ups,
;                                      switched CAN termination
;
;   pio run -e <env> -t buildfs / -t uploadfs    LittleFS web-UI image (data/)
;   python tools/make_release.py --env <env>     package Releases/V<ver>/ (or V<ver>-S3/)
;
; Each env sets ONE of -DBOARD_DEVKIT=1 / -DBOARD_S3=1; everything
; board-specific keys off BOARD_S3 in include/can2cluster_defs.h.

[platformio]
default_envs = esp32doit-devkit-v1
; No build_dir / libdeps_dir here: on the desktop PLATFORMIO_WORKSPACE_DIR puts
; the build tree on local C: (off Google Drive), and the .bin/.elf files are
; copied back to .pio/build/<env>/ after each build.

; ---- shared by both boards ---------------------------------------------------
[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
; Decode the panic backtrace to file:line instead of raw addresses.
; (OpenHaldex's C6 project already does this.)
monitor_filters =
  esp32_exception_decoder
  colorize
upload_speed = 921600   ; 2x the 460800 board default; matches the other projects
board_build.filesystem = littlefs

; Optional build flags you can tweak as needed
build_flags = -Wno-error=cast-qual

lib_deps =
  mathertel/OneButton @ ^2.5.0
  RobTillaart/RunningMedian
  mikalhart/TinyGPSPlus

  me-no-dev/ESPAsyncWebServer
  bblanchon/ArduinoJson
  me-no-dev/AsyncTCP

; ---- ESP32 DevKit V1 boards (the original Can2Cluster PCB) ------------------
[env:esp32doit-devkit-v1]
board = esp32doit-devkit-v1
board_build.partitions = partitions_can2cluster.csv
build_flags =
  ${env.build_flags}
  -DBOARD_DEVKIT=1

; ---- S3 board (ESP32-S3-WROOM-1-N16R8 soldered down) -------------------------
[env:esp32-s3]
board = esp32-s3-devkitc-1
; The N16R8 module carries 16 MB flash; the devkitc-1 manifest assumes 8 MB, so
; both the builder and the uploader need telling.
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.flash_mode = qio
board_build.partitions = partitions_can2cluster_16MB.csv
; The module's 8 MB octal PSRAM is not needed by this firmware and is left
; disabled. To use it: add -DBOARD_HAS_PSRAM to build_flags and set
; board_build.arduino.memory_type = qio_opi
;
; Console + esptool run over the module's native USB (IO19/IO20) - there is no
; CH340 on this board. Keep DTR/RTS deasserted so opening a serial monitor
; doesn't drop the chip into download mode.
monitor_dtr = 0
monitor_rts = 0
build_flags =
  ${env.build_flags}
  -DBOARD_S3=1
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
